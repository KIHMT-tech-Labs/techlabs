name: LeakCheck tests

on:
  push:
    paths:
      - "projects/leakcheck/**"
      - ".github/workflows/leakcheck-tests.yml"
  pull_request:
    paths:
      - "projects/leakcheck/**"
      - ".github/workflows/leakcheck-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s projects/leakcheck -p 'test_*.py' -v
